<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Royal Blue Apni Estate Brand Color: #1D4ED8 -->
  <g fill="#1D4ED8">
    <!-- Negative-space architectural house block -->
    <path d="M 140 70 
             L 360 70 
             L 360 215 
             L 290 145 
             L 235 195 
             L 235 150 
             L 190 150 
             L 190 238 
             L 140 295 
             Z" />
    
    <!-- 4-Pane Window Grid under the roof ridge -->
    <rect x="270" y="190" width="15" height="15" rx="1" />
    <rect x="290" y="190" width="15" height="15" rx="1" />
    <rect x="270" y="210" width="15" height="15" rx="1" />
    <rect x="290" y="210" width="15" height="15" rx="1" />

    <!-- Clean Geometric Typography: APNI ESTATE -->
    <text 
      x="250" 
      y="385" 
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
      font-size="44" 
      font-weight="800" 
      letter-spacing="0.28em" 
      text-anchor="middle"
    >APNI ESTATE</text>
  </g>
</svg>
